<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>03 · chamada com foto</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide 3 de 3 · chamada com foto. O fundo fica mais escuro (dim alto) para o texto e o botão mandarem;
  // 4 compassos, sem dica de deslizar. O texto volta linha a linha, o título sai e volta com impacto e o
  // botão some e estoura de novo perto do fim.
  window.SLIDE = {
    n: 3, total: 3,
    label: "Os 5 movimentos",
    title: "Quer o treino\nde 20 minutos?",
    text: "Comente PESO que eu te mando os 5 movimentos, na ordem, com o tempo de cada um.",
    button: "Comente PESO",
    images: { fundo: "../assets/fundo.jpg" },
    theme: "noir", format: "4:5",
    bars: 4, bpm: 120, seed: 11,
    totalBars: 10, offsetBars: 6,
    textOut: 0.5, textBack: 2, out: 7, back: 9, buttonOut: 12, buttonBack: 13,
  };
  const S = window.SLIDE;
  const C = Carousel.setup({ bars: S.bars, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "03 · chamada com foto" });
  const ready = C.loadImages(S.images);

  window.seek = async (t) => {
    await ready;
    C.begin(t);
    C.image("fundo", { depth: 0.35, dim: 0.55, focusX: 0.2 });
    C.scrim({ side: "top", size: 0.5, alpha: 0.85 });
    C.scrim({ side: "bottom", size: 0.3, alpha: 0.92 });
    C.grain(0.35);
    C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 124, out: S.out, outStyle: "rise", back: S.back, in: "slam" });
    C.body(S.text, { y: title.bottom + 44, size: 54, maxWidth: 900, perLine: 1, out: S.textOut, back: S.textBack });
    C.cta(S.button, { y: 0.7, size: 58, pulse: true, out: S.buttonOut, outStyle: "shrink", back: S.buttonBack, in: "pop" });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    return C.end();
  };
</script>
</body>
</html>
