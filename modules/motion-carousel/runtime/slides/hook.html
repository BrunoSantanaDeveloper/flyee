<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Slide __N__ · gancho</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide de gancho: a capa do carrossel. Edite só o bloco SLIDE ou troque os helpers dentro de seek;
  // mantenha at: 0 no título (o quadro 0 é a capa e o loop fecha nele). Os momentos são em batidas
  // contadas do início do slide (120 BPM: 1 batida = 0,5 s; 3 compassos = 12 batidas).
  // Todos os helpers e opções: .flyee/modules/motion-carousel/references/slide-page.md; um carrossel completo: .flyee/modules/motion-carousel/references/exemplo/.
  window.SLIDE = {
    n: __N__, total: __TOTAL__,
    label: "",                              // rótulo pequeno acima do título; vazio = sem rótulo
    title: "__TITLE__",                     // use \n para quebrar as linhas (até 3); a primeira sai na cor de acento
    text: "__TEXT__",                       // frases de apoio abaixo do título, uma por linha (use \n); vazio = sem texto
    theme: __THEME__, format: "__FORMAT__",
    bars: __BARS__, beatsPerBar: __BEATS_PER_BAR__, bpm: __BPM__, seed: __SEED__,
    totalBars: __TOTAL_BARS__, offsetBars: __OFFSET_BARS__,
    textOut: 0.5, textBack: 2,              // o texto de apoio sai logo e volta uma linha por batida: o slide se mexe desde o começo
    out: null, back: null,                  // null = o título sai 5 batidas antes do fim e volta com impacto 3 antes
  };
  const S = window.SLIDE;
  const BEATS = S.bars * S.beatsPerBar;
  const OUT = S.out === null ? BEATS - 5 : S.out;
  const BACK = S.back === null ? BEATS - 3 : S.back;
  const C = Carousel.setup({ bars: S.bars, beatsPerBar: S.beatsPerBar, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "Slide " + S.n + " · gancho" });

  window.seek = (t) => {
    C.begin(t);
    C.glow({ x: 0.82, y: 0.18, alpha: 0.08 });
    C.pulseBg(0.03);
    let y = 176;
    if (S.label) C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y, size: 176, colors: S.title.indexOf("\n") >= 0 ? ["accent"] : null, out: OUT, outStyle: "rise", back: BACK, in: "slam" });
    y = title.bottom + 52;
    C.shape({ kind: "line", x: 72, y, x2: 292, y2: y, lineWidth: 8, out: S.textOut, back: S.textBack - 0.5, in: "draw" });
    if (S.text) C.body(S.text, { y: y + 44, size: 58, lineHeight: 1.2, maxWidth: 900, perLine: 1, out: S.textOut, back: S.textBack });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    if (S.n < S.total) C.swipeHint({});
    return C.end();
  };
</script>
</body>
</html>
