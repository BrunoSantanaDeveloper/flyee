<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>05 · chamada</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide 5 de 5 · chamada. Edite o bloco SLIDE ou troque os helpers em seek; mantenha at: 0 no título.
  // Último slide: 4 compassos (16 batidas), sem dica de deslizar. Três momentos mantêm o slide vivo: o texto volta
  // linha a linha, o título sai e volta com impacto, e o botão some e estoura de novo perto do fim.
  window.SLIDE = {
    n: 5, total: 5,
    label: "O plano de 30 dias",
    title: "Quer o plano\ndia por dia?",
    text: "Comente TREINO que eu te mando o passo a passo: meta pequena, placar visível, 2 minutos por dia.",
    button: "Comente TREINO",
    theme: "noir", format: "4:5",
    bars: 4, bpm: 120, seed: 7,
    totalBars: 16, offsetBars: 12,
    textOut: 0.5, textBack: 2,     // o texto sai na batida 0,5 e volta uma linha por batida a partir da 2
    out: 7, back: 9,               // o título sai na batida 7 e volta com impacto na 9
    buttonOut: 12, buttonBack: 13, // o botão some na 12 e estoura de novo na 13
  };
  const S = window.SLIDE;
  const C = Carousel.setup({ bars: S.bars, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "05 · chamada" });

  window.seek = (t) => {
    C.begin(t);
    C.glow({ x: 0.82, y: 0.18, alpha: 0.08 });
    C.pulseBg(0.03);
    C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 150, out: S.out, outStyle: "rise", back: S.back, in: "slam" });
    C.body(S.text, { y: title.bottom + 44, size: 54, maxWidth: 900, perLine: 1, out: S.textOut, back: S.textBack });
    C.cta(S.button, { y: 0.7, size: 58, pulse: true, out: S.buttonOut, outStyle: "shrink", back: S.buttonBack, in: "pop" });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    return C.end();
  };
</script>
</body>
</html>
