<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia do carrossel</title>
<style>
  :root { --bg: #101012; --panel: #1c1c1f; --ink: #f2f1ec; --muted: #9a978f; --accent: #e6c15a; --line: #2a2a2e; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0 0 2px; }
  .mode { color: var(--muted); font-size: 13px; }
  .toolbar { display: flex; gap: 8px; }
  .toolbar button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; cursor: pointer; font: inherit; font-weight: 600; }
  .toolbar button[aria-pressed="true"] { background: var(--accent); color: #111; border-color: var(--accent); }
  .stage { display: flex; justify-content: center; }
  .stage.off { display: none; }
  .phone { width: 380px; background: #000; border-radius: 40px; border: 7px solid #262628; padding: 12px 0 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); user-select: none; -webkit-user-select: none; }
  .ig-top { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px; }
  .ig-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #3a3a3d, #6a6a6e); flex: none; }
  .ig-name { width: 112px; height: 10px; border-radius: 5px; background: #3a3a3d; }
  .ig-sub { width: 72px; height: 8px; border-radius: 4px; background: #29292c; margin-top: 5px; }
  .media { position: relative; width: 100%; overflow: hidden; background: #000; touch-action: pan-y; cursor: grab; }
  .media.dragging { cursor: grabbing; }
  .track { display: flex; height: 100%; will-change: transform; }
  .track.snap { transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
  .slide { flex: 0 0 100%; height: 100%; position: relative; }
  .slide video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; pointer-events: none; }
  .counter { position: absolute; top: 12px; right: 12px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; letter-spacing: .02em; }
  .sound { position: absolute; right: 12px; bottom: 12px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .62); border: 0; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
  .sound svg { width: 14px; height: 14px; fill: #fff; }
  .ig-actions { display: flex; gap: 14px; padding: 10px 14px 4px; align-items: center; }
  .ig-actions svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dots { margin-left: auto; margin-right: auto; display: flex; gap: 4px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: #444; display: block; }
  .dots i.on { background: #3797f0; }
  .caption { padding: 4px 14px 0; font-size: 13px; color: #d8d8d8; display: flex; align-items: center; gap: 8px; }
  .caption .ig-name { width: 64px; height: 9px; }
  .grid { display: none; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .grid.on { display: flex; }
  .cell { width: 212px; }
  .cell video { width: 100%; display: block; border-radius: 8px; background: #000; }
  .cell .meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; justify-content: space-between; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Prévia do carrossel</h1>
      <div class="mode" id="mode"></div>
    </div>
    <div class="toolbar">
      <button id="btn-feed" type="button" aria-pressed="true">Feed</button>
      <button id="btn-grid" type="button" aria-pressed="false">Grade</button>
      <button id="btn-sound" type="button" aria-pressed="false">Som</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="phone">
      <div class="ig-top">
        <div class="ig-avatar"></div>
        <div><div class="ig-name"></div><div class="ig-sub"></div></div>
      </div>
      <div class="media" id="media">
        <div class="track" id="track"></div>
        <div class="counter" id="counter">1/1</div>
        <button class="sound" id="sound" type="button" title="Som">
          <svg id="icon-off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3 3-3-1.4-1.4-3 3-3-3L10.7 9l3 3-3 3 1.4 1.4 3-3 3 3 1.4-1.4-3-3z"/></svg>
          <svg id="icon-on" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
        </button>
      </div>
      <div class="ig-actions">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7.5 2.5c0 5.4-7.5 10-7.5 10z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M21 3 10 13M21 3l-7 18-4-8-8-4 19-6z"/></svg>
        <div class="dots" id="dots"></div>
        <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4V3z"/></svg>
      </div>
      <div class="caption"><div class="ig-name"></div><span id="caption"></span></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <p class="hint" id="hint">Arraste para deslizar · setas ← e → · "Grade" mostra todos os slides tocando juntos</p>
</div>

<script>
  // O script do carrossel substitui o marcador abaixo pelo JSON { title, format, slides, mode }.
  const CAROUSEL = [/*__CAROUSEL__*/][0] || { title: "Prévia do carrossel", format: { name: "4:5", width: 1080, height: 1350 }, slides: [], mode: "final" };

  const $ = (id) => document.getElementById(id);
  const slides = Array.isArray(CAROUSEL.slides) ? CAROUSEL.slides : [];
  const total = slides.length;
  const format = CAROUSEL.format || { name: "4:5", width: 1080, height: 1350 };
  let current = 0;
  let soundOn = false;
  let view = "feed";
  const videos = [];
  const gridVideos = [];

  $("title").textContent = CAROUSEL.title || "Prévia do carrossel";
  $("mode").textContent = (CAROUSEL.mode === "previa" ? "Prévia em tamanho reduzido" : "Render final") + " · " + (format.name || "") + " (" + format.width + "×" + format.height + ") · " + total + " slide" + (total === 1 ? "" : "s");
  $("caption").textContent = CAROUSEL.title || "";
  $("media").style.aspectRatio = format.width + " / " + format.height;

  if (!total) {
    $("stage").innerHTML = '<p class="empty">Nenhum slide renderizado ainda.</p>';
    $("hint").textContent = "";
  }

  for (const slide of slides) {
    const cell = document.createElement("div");
    cell.className = "slide";
    const video = document.createElement("video");
    video.src = slide.file;
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    video.setAttribute("playsinline", "");
    video.preload = "auto";
    cell.appendChild(video);
    $("track").appendChild(cell);
    videos.push(video);

    const dot = document.createElement("i");
    $("dots").appendChild(dot);

    const gcell = document.createElement("div");
    gcell.className = "cell";
    const gvideo = document.createElement("video");
    gvideo.src = slide.file;
    gvideo.muted = true;
    gvideo.loop = true;
    gvideo.playsInline = true;
    gvideo.setAttribute("playsinline", "");
    gvideo.preload = "auto";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = "<span>" + (slide.n || "") + " · " + (slide.role || "") + "</span><span>" + (slide.duration ? Number(slide.duration).toFixed(1).replace(".", ",") + " s" : "") + "</span>";
    gcell.appendChild(gvideo);
    gcell.appendChild(meta);
    $("grid").appendChild(gcell);
    gridVideos.push(gvideo);
  }

  function play(video) {
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  }

  function sync() {
    $("counter").textContent = (current + 1) + "/" + total;
    const dots = $("dots").children;
    for (let i = 0; i < dots.length; i++) dots[i].className = i === current ? "on" : "";
    videos.forEach((video, i) => {
      if (i === current) {
        video.muted = !soundOn;
        play(video);
      } else {
        video.muted = true;
        video.pause();
        try { video.currentTime = 0; } catch (e) { /* ainda carregando */ }
      }
    });
    $("icon-off").style.display = soundOn ? "none" : "";
    $("icon-on").style.display = soundOn ? "" : "none";
    $("btn-sound").setAttribute("aria-pressed", soundOn ? "true" : "false");
  }

  function go(index) {
    current = Math.max(0, Math.min(total - 1, index));
    const track = $("track");
    track.classList.add("snap");
    track.style.transform = "translateX(" + (-current * 100) + "%)";
    sync();
  }

  // Arrastar com o dedo ou o mouse
  const media = $("media");
  let drag = null;
  media.addEventListener("pointerdown", (event) => {
    if (!total) return;
    drag = { x: event.clientX, dx: 0, width: media.clientWidth, time: performance.now() };
    media.classList.add("dragging");
    $("track").classList.remove("snap");
    media.setPointerCapture(event.pointerId);
  });
  media.addEventListener("pointermove", (event) => {
    if (!drag) return;
    drag.dx = event.clientX - drag.x;
    const limit = (current === 0 && drag.dx > 0) || (current === total - 1 && drag.dx < 0) ? 0.35 : 1;
    $("track").style.transform = "translateX(calc(" + (-current * 100) + "% + " + (drag.dx * limit) + "px))";
  });
  const release = (event) => {
    if (!drag) return;
    const dt = Math.max(1, performance.now() - drag.time);
    const fast = Math.abs(drag.dx) / dt > 0.5;
    const far = Math.abs(drag.dx) > drag.width * 0.2;
    const step = (fast || far) ? (drag.dx < 0 ? 1 : -1) : 0;
    drag = null;
    media.classList.remove("dragging");
    go(current + step);
  };
  media.addEventListener("pointerup", release);
  media.addEventListener("pointercancel", release);

  document.addEventListener("keydown", (event) => {
    if (event.code === "ArrowRight") go(current + 1);
    else if (event.code === "ArrowLeft") go(current - 1);
    else if (event.code === "KeyM") toggleSound();
  });

  function toggleSound() {
    soundOn = !soundOn;
    sync();
  }
  $("sound").addEventListener("click", (event) => { event.stopPropagation(); toggleSound(); });
  $("btn-sound").addEventListener("click", toggleSound);

  function setView(next) {
    view = next;
    $("btn-feed").setAttribute("aria-pressed", view === "feed" ? "true" : "false");
    $("btn-grid").setAttribute("aria-pressed", view === "grid" ? "true" : "false");
    $("stage").classList.toggle("off", view !== "feed");
    $("grid").classList.toggle("on", view === "grid");
    if (view === "grid") {
      videos.forEach((video) => video.pause());
      gridVideos.forEach((video) => {
        try { video.currentTime = 0; } catch (e) { /* ainda carregando */ }
        play(video);
      });
      $("hint").textContent = "Todos os slides tocam juntos a partir do quadro 0: confira a continuidade da régua e das cores.";
    } else {
      gridVideos.forEach((video) => video.pause());
      sync();
      $("hint").textContent = "Arraste para deslizar · setas ← e → · \"Grade\" mostra todos os slides tocando juntos";
    }
  }
  $("btn-feed").addEventListener("click", () => setView("feed"));
  $("btn-grid").addEventListener("click", () => setView("grid"));

  if (total) go(0);
</script>
</body>
</html>
