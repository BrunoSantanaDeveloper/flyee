<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Janelas que flutuam sobre a página</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #ffffff; color: #111111; }
  /* A thin bar that belongs to the page: it stays in the photo with no letters. */
  #barra { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgb(0, 128, 128); z-index: 10; }
  section { height: 1100px; padding: 120px 80px 0; }
  /* A region picker with its backdrop, and a chat panel: they float over the page and are not the page. */
  #fundo { position: fixed; inset: 0; background: rgba(120, 0, 160, 0.9); z-index: 40; }
  #regiao { position: fixed; top: 20%; left: 30%; width: 40%; height: 40%; background: rgb(120, 0, 160); z-index: 41; }
  #chat { position: fixed; right: 16px; bottom: 16px; width: 320px; height: 420px; background: rgb(255, 140, 0); z-index: 42; }
</style>
</head>
<body>
  <div id="barra"></div>
  <section><h1>Uma página com janelas por cima</h1></section>
  <section><p>Mais conteúdo.</p></section>
  <div id="chat"><p>Fale com a gente</p><textarea aria-label="Mensagem"></textarea></div>
  <assistente-chat></assistente-chat>
  <script>
    // A widget that keeps its fixed panel inside its own shadow tree.
    customElements.define("assistente-chat", class extends HTMLElement {
      connectedCallback() {
        const root = this.attachShadow({ mode: "open" });
        root.innerHTML = '<div style="position:fixed;left:16px;bottom:16px;width:300px;height:400px;background:rgb(0,90,255);z-index:43"><p>Assistente</p><input aria-label="Pergunta"></div>';
      }
    });
    // A widget host that hangs from <html> itself, outside <body>, as the Qualified chat does on
    // databricks.com: a transparent layer the size of the screen, with the panel inside it.
    const host = document.createElement("div");
    host.id = "widget-na-raiz";
    host.style.cssText = "position:fixed;inset:0;z-index:44;pointer-events:none";
    host.innerHTML = '<div style="position:absolute;right:24px;top:140px;width:280px;height:300px;background:rgb(200,0,120);pointer-events:auto"><p>Converse com vendas</p></div>';
    document.documentElement.append(host);
  </script>
  <script>
    setTimeout(() => {
      const backdrop = document.createElement("div");
      backdrop.id = "fundo";
      const picker = document.createElement("div");
      picker.id = "regiao";
      picker.setAttribute("role", "dialog");
      picker.setAttribute("aria-modal", "true");
      picker.innerHTML = "<p>Escolha a sua região</p><select><option>Brasil</option></select>";
      document.body.append(backdrop, picker);
    }, 800);
  </script>
</body>
</html>
