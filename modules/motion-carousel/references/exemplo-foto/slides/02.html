<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>02 · ponto com foto</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide 2 de 3 · ponto com foto. O haltere sai na batida 1 e volta subindo na 2,5; os três movimentos
  // entram a cada batida e meia a partir da 2, e a frase de fecho volta na 8,5, para o fim não ficar parado.
  // O fundo é o mesmo do slide 1: a continuidade vem dele e da régua.
  window.SLIDE = {
    n: 2, total: 3,
    label: "Por que funciona",
    title: "O corpo todo\nem um objeto.",
    text: "Agachamento.\nBalanço.\nLevantamento.",
    close: "Sem trocar de equipamento.",
    images: { fundo: "../assets/fundo.jpg", assunto: "../assets/halter.webp" },
    theme: "noir", format: "4:5",
    bars: 3, bpm: 120, seed: 11,
    totalBars: 10, offsetBars: 3,
    out: 1, back: 2, step: 1.5, closeBack: 8.5,
  };
  const S = window.SLIDE;
  const C = Carousel.setup({ bars: S.bars, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "02 · ponto com foto" });
  const ready = C.loadImages(S.images);

  window.seek = async (t) => {
    await ready;
    C.begin(t);
    C.image("fundo", { depth: 0.35, dim: 0.3, focusX: 0.8 });
    C.scrim({ side: "top", size: 0.6, alpha: 0.88 });
    C.scrim({ side: "left", size: 0.6, alpha: 0.55 }); // atrás da coluna de texto
    C.scrim({ side: "bottom", size: 0.3, alpha: 0.92 });
    C.grain(0.35);
    C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 132 });
    const ruleY = title.bottom + 40;
    C.shape({ kind: "line", x: 72, y: ruleY, x2: 232, y2: ruleY, lineWidth: 8, out: S.out, back: S.back - 0.5, in: "draw" });
    const lines = C.body(S.text, { y: ruleY + 40, size: 60, lineHeight: 1.25, maxWidth: 470, perLine: S.step, out: S.out, back: S.back });
    C.body(S.close, { y: lines.bottom + 36, size: 46, maxWidth: 470, out: S.out, back: S.closeBack }); // na cor do texto: sobre foto, cinza some
    C.image("assunto", { x: 0.44, y: 0.36, w: 0.52, h: 0.47, fit: "contain", anchor: "bottom-right", depth: 1, shadow: true, out: S.out, back: S.back + 0.5, in: "rise" });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    C.swipeHint({});
    return C.end();
  };
</script>
</body>
</html>
