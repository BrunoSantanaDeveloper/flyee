<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>01 · gancho</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide 1 de 5 · gancho. Edite o bloco SLIDE (textos e momentos) ou troque os helpers dentro de seek.
  // Mantenha at: 0 no título: o quadro 0 é a capa do slide e o loop fecha nele.
  // Os momentos são em batidas contadas do início do slide (120 BPM: 1 batida = 0,5 s; 3 compassos = 12 batidas).
  window.SLIDE = {
    n: 1, total: 5,
    label: "Todo ano a mesma cena",
    title: "Fevereiro\nmata\nacademias.",
    text: "Lotada em janeiro.\nVazia em março.\nE não é falta de vontade.",
    theme: "noir", format: "4:5",
    bars: 3, bpm: 120, seed: 7,
    totalBars: 16, offsetBars: 0,
    textOut: 0.5, textBack: 2, // o texto de apoio sai na batida 0,5 e volta uma linha por batida a partir da 2
    out: 7, back: 9,           // o título sai na batida 7 (whoosh) e volta com impacto na 9
  };
  const S = window.SLIDE;
  const C = Carousel.setup({ bars: S.bars, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "01 · gancho" });

  window.seek = (t) => {
    C.begin(t);
    C.glow({ x: 0.82, y: 0.18, alpha: 0.08 });
    C.pulseBg(0.03);
    C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 176, colors: ["accent", "ink", "ink"], out: S.out, outStyle: "rise", back: S.back, in: "slam" });
    const ruleY = title.bottom + 52;
    C.shape({ kind: "line", x: 72, y: ruleY, x2: 292, y2: ruleY, lineWidth: 8, out: S.textOut, back: S.textBack - 0.5, in: "draw" });
    C.body(S.text, { y: ruleY + 44, size: 58, lineHeight: 1.2, maxWidth: 900, perLine: 1, out: S.textOut, back: S.textBack });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    C.swipeHint({});
    return C.end();
  };
</script>
</body>
</html>
