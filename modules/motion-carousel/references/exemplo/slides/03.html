<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>03 · ponto</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide 3 de 5 · ponto. Edite o bloco SLIDE ou troque os helpers em seek; mantenha at: 0 no título.
  // A bola pula para a direita perdendo impulso (a metáfora da dor sem placar) e volta a tempo de fechar o loop.
  window.SLIDE = {
    n: 3, total: 5,
    label: "Motivo 2 de 3",
    title: "Dor sem placar.",
    lines: "Você treina.\nDói.\nNinguém marca o ponto.", // uma linha por batida a partir de `back`
    text: "Sem placar, a única coisa que cresce é a desculpa.",
    theme: "noir", format: "4:5",
    bars: 3, bpm: 120, seed: 7,
    totalBars: 16, offsetBars: 6,
    out: 1.5, back: 2,
    ball: { at: 2, beats: 4, back: 7, hops: [2, 1.25, 0.75] }, // pousa nas batidas 4, 5,25 e 6; volta entre 7 e 11
  };
  const S = window.SLIDE;
  const C = Carousel.setup({ bars: S.bars, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "03 · ponto" });

  window.seek = (t) => {
    C.begin(t);
    C.glow({ x: 0.82, y: 0.18, alpha: 0.08 });
    C.pulseBg(0.03);
    C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 140 });
    const lines = C.body(S.lines, { y: title.bottom + 44, size: 60, lineHeight: 1.2, perLine: 1, out: S.out, back: S.back });
    C.body(S.text, { y: lines.bottom + 44, size: 44, color: "muted", maxWidth: 820, out: S.out, back: 8 });
    C.shape({ kind: "line", x: 72, y: 1040, x2: 1008, y2: 1040, lineWidth: 3, color: C.rgba(C.theme.ink, 0.25), in: "none" });
    C.ball(Object.assign({ from: [116, 996], to: [964, 996], radius: 44, height: 200 }, S.ball));
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    C.swipeHint({});
    return C.end();
  };
</script>
</body>
</html>
