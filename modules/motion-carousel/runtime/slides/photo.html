<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Slide __N__ · foto</title>
<style>
  html, body { margin: 0; background: #0C0C0E; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="../motion.js"></script>
<script src="../carousel.js"></script>
<script>
  // Slide com foto: um fundo que ocupa o quadro, um assunto recortado por cima e o texto num degradê.
  // Edite só o bloco SLIDE ou troque os helpers dentro de seek; mantenha at: 0 no título.
  // As imagens ficam em ../assets/ (a pasta assets do carrossel). Sem uma delas o slide é desenhado
  // sem ela: dá para conferir o texto antes de as fotos existirem.
  // De onde vêm as imagens e como pedir cada uma: .flyee/modules/motion-carousel/references/images.md; todos os helpers: .flyee/modules/motion-carousel/references/slide-page.md.
  window.SLIDE = {
    n: __N__, total: __TOTAL__,
    label: "",                              // rótulo pequeno acima do título; vazio = sem rótulo
    title: "__TITLE__",                     // use \n para quebrar as linhas (até 3)
    text: "__TEXT__",                       // frases curtas, uma por linha (use \n); entram uma por batida
    images: {
      fundo: "../assets/fundo.jpg",         // foto que preenche o quadro (4:5); "" = sem fundo, só a cor do tema
      assunto: "../assets/assunto.png",     // recorte com fundo transparente (.png ou .webp); "" = sem assunto
    },
    theme: __THEME__, format: "__FORMAT__",
    bars: __BARS__, beatsPerBar: __BEATS_PER_BAR__, bpm: __BPM__, seed: __SEED__,
    totalBars: __TOTAL_BARS__, offsetBars: __OFFSET_BARS__,
    textOut: 0.5, textBack: 2,              // o texto e o assunto saem logo; o texto volta uma linha por batida
    out: null, back: null,                  // null = o título sai 5 batidas antes do fim e volta 3 antes, para o fim não ficar parado
  };
  const S = window.SLIDE;
  const BEATS = S.bars * S.beatsPerBar;
  const OUT = S.out === null ? BEATS - 5 : S.out;
  const BACK = S.back === null ? BEATS - 3 : S.back;
  const C = Carousel.setup({ bars: S.bars, beatsPerBar: S.beatsPerBar, bpm: S.bpm, format: S.format, theme: S.theme, seed: S.seed, title: "Slide " + S.n + " · foto" });
  const ready = C.loadImages(S.images);

  window.seek = async (t) => {
    await ready;
    C.begin(t);
    // 1. o fundo: deriva devagar e volta ao lugar no fim do slide; escurecido para o texto ler bem
    C.image("fundo", { depth: 0.35, dim: 0.3 });
    C.scrim({ side: "top", size: 0.6, alpha: 0.88 });
    C.scrim({ side: "left", size: 0.6, alpha: 0.55 }); // atrás da coluna de texto
    C.scrim({ side: "bottom", size: 0.3, alpha: 0.92 });
    if (C.theme.grain) C.grain(0.35);
    // 2. o texto, em cima à esquerda, longe do assunto
    if (S.label) C.label(S.label, { y: 96, size: 44 });
    const title = C.headline(S.title, { y: 176, size: 132, out: OUT, outStyle: "rise", back: BACK, in: "rise" });
    const ruleY = title.bottom + 40;
    C.shape({ kind: "line", x: 72, y: ruleY, x2: 232, y2: ruleY, lineWidth: 8, out: S.textOut, back: S.textBack - 0.5, in: "draw" });
    if (S.text) C.body(S.text, { y: ruleY + 40, size: 56, lineHeight: 1.2, maxWidth: 400, perLine: 1, out: S.textOut, back: S.textBack }); // termina antes da caixa do assunto
    // 3. o assunto recortado, embaixo à direita: mais perto da câmera, mexe mais que o fundo
    C.image("assunto", { x: 0.44, y: 0.36, w: 0.52, h: 0.46, fit: "contain", anchor: "bottom-right", depth: 1, shadow: true, out: S.textOut, back: S.textBack + 0.5, in: "rise" });
    C.ruler({ y: 1140, totalBars: S.totalBars, offsetBars: S.offsetBars, bars: S.bars });
    C.progress({ step: S.n, total: S.total });
    if (S.n < S.total) C.swipeHint({});
    return C.end();
  };
</script>
</body>
</html>
