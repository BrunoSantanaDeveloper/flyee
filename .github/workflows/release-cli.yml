name: Release CLI

# Publishes packages/cli to npm when a tag `cli-v<version>` is pushed. The tag
# must match the version in packages/cli/package.json.
#
# No token: npm trusts this workflow by its identity (trusted publishing,
# https://docs.npmjs.com/trusted-publishers), configured on npmjs.com for the
# package `flyee` with this repository and the workflow file `release-cli.yml`.
# That needs `id-token: write` and npm 11.5.1 or newer at publish time (Node 22
# ships npm 10, which fails with a misleading 404). The repository has been
# public since 2026-10-29, so npm signs a provenance statement by itself and
# refuses the package (E422) unless `repository.url` in packages/cli/package.json
# names this repository. No cache in a release build.

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run ci:verify
      - name: Check the tag against the package version
        run: |
          expected="cli-v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected"; exit 1
          fi
      - name: npm 11 for trusted publishing
        run: |
          npm install -g npm@11
          npm --version
      - run: npm publish -w flyee --access public
